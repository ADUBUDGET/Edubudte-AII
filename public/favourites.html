<script src="/shared.js"></script>
<script>
  // Product names and stores come from third-party listings, so all text is
  // inserted with textContent (never innerHTML).
  const FILTER_KEY = 'eb-fav-filter'; // remembered per browser, not sensitive
  let favourites = [];
  let filter = 'all';
  try { filter = localStorage.getItem(FILTER_KEY) || 'all'; } catch (e) { /* storage blocked */ }
  if (!['all', 'todo', 'done'].includes(filter)) filter = 'all';

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  const icon = (name, extra) => el('span', 'material-symbols-outlined' + (extra ? ' ' + extra : ''), name);
  const safeLink = url => (typeof url === 'string' && /^https?:\/\//i.test(url) ? url : null);
  const shortDate = value => new Date(value).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });

  function renderFilters() {
    const counts = {
      all: favourites.length,
      todo: favourites.filter(f => !f.purchased_at).length,
      done: favourites.filter(f => f.purchased_at).length,
    };
    document.querySelectorAll('.fav-filter').forEach(btn => {
      const active = btn.dataset.filter === filter;
      btn.setAttribute('aria-pressed', String(active));
      btn.className = 'fav-filter whitespace-nowrap px-4 py-2 rounded-full border font-label-sm fav-focusable ' +
        (active ? 'bg-primary-container/20 border-primary/30 text-primary' : 'bg-glass-surface border-glass-stroke text-on-surface hover:bg-white/5');
      btn.querySelector('[data-count]').textContent = '(' + counts[btn.dataset.filter] + ')';
    });
    const pct = counts.all ? Math.round((counts.done / counts.all) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = counts.all
      ? `${counts.done} of ${counts.all} purchased`
      : 'No favourites yet';
    document.getElementById('clearPurchasedBtn').classList.toggle('hidden', counts.done === 0);
  }

  function emptyMessage() {
    const li = el('li', 'glass-panel rounded-2xl p-8 text-center flex flex-col items-center gap-3 lg:col-span-2');
    if (!favourites.length) {
      li.appendChild(icon('favorite', 'text-5xl text-primary'));
      li.appendChild(el('p', 'font-body-lg text-on-surface font-bold', 'No favourites yet'));
      li.appendChild(el('p', 'font-body-md text-on-surface-variant', 'Tap "Save to Favourites" on any product in the Shop, or add one above.'));
      const shop = el('a', 'px-4 py-2 rounded-xl border border-glass-stroke text-primary font-label-lg fav-focusable', 'Go to Shop');
      shop.href = '/search.html';
      li.appendChild(shop);
    } else if (filter === 'todo') {
      li.appendChild(icon('task_alt', 'text-5xl text-primary'));
      li.appendChild(el('p', 'font-body-lg text-on-surface font-bold', 'Everything is purchased'));
      li.appendChild(el('p', 'font-body-md text-on-surface-variant', 'Tap "Start a new shop" when you are ready to shop again.'));
    } else {
      li.appendChild(el('p', 'font-body-md text-on-surface-variant', 'Nothing marked as purchased yet. Tick an item when it is in your basket.'));
    }
    return li;
  }

  function favouriteRow(f) {
    const purchased = !!f.purchased_at;
    const li = el('li', 'fav-row glass-panel rounded-2xl p-4 flex gap-4 items-start' + (purchased ? ' is-purchased' : ''));

    const box = el('input', 'fav-check bg-transparent border-glass-stroke text-primary focus:ring-primary shrink-0 mt-1');
    box.type = 'checkbox';
    box.id = 'fav-' + f.id;
    box.checked = purchased;
    box.addEventListener('change', () => setPurchased(f, box.checked));
    li.appendChild(box);

    const media = el('div', 'fav-media w-14 h-14 rounded-xl bg-surface-container-high overflow-hidden flex items-center justify-center shrink-0');
    const thumb = safeLink(f.thumbnail);
    if (thumb) {
      const img = el('img', 'w-full h-full object-cover');
      img.src = thumb;
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('error', () => { img.remove(); media.appendChild(icon('shopping_basket', 'text-on-surface-variant')); });
      media.appendChild(img);
    } else {
      media.appendChild(icon('shopping_basket', 'text-on-surface-variant'));
    }
    li.appendChild(media);

    const body = el('div', 'flex-1 min-w-0');
    const label = el('label', 'block cursor-pointer');
    label.htmlFor = box.id;
    label.appendChild(el('span', 'fav-name block font-body-md text-on-surface font-bold break-words', f.item_name));
    const detail = [];
    if (f.price != null) detail.push(formatZAR(f.price));
    if (f.store_name) detail.push(f.store_name);
    if (detail.length) label.appendChild(el('span', 'block text-sm text-on-surface-variant', detail.join(' at ') + (f.price != null ? ' (saved price)' : '')));
    body.appendChild(label);
    body.appendChild(el('span', 'block text-xs mt-1 ' + (purchased ? 'text-primary' : 'text-on-surface-variant'),
      purchased ? 'Purchased ' + shortDate(f.purchased_at) : 'Saved ' + shortDate(f.created_at)));

    const actions = el('div', 'flex flex-wrap gap-x-4 gap-y-1 mt-2');
    const addToList = el('button', 'text-primary font-label-sm hover:underline fav-focusable rounded', 'Add to grocery list');
    addToList.type = 'button';
    addToList.addEventListener('click', () => addToGroceryList(f));
    actions.appendChild(addToList);
    const link = safeLink(f.link);
    if (link) {
      const a = el('a', 'text-primary font-label-sm hover:underline fav-focusable rounded', 'View deal');
      a.href = link;
      a.target = '_blank';
      a.rel = 'noopener';
      actions.appendChild(a);
    }
    body.appendChild(actions);
    li.appendChild(body);

    const remove = el('button', 'w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:text-error hover:bg-white/5 shrink-0 fav-focusable');
    remove.type = 'button';
    remove.setAttribute('aria-label', 'Remove ' + f.item_name + ' from favourites');
    remove.appendChild(icon('delete'));
    remove.addEventListener('click', () => removeFavourite(f));
    li.appendChild(remove);
    return li;
  }

  function render() {
    renderFilters();
    const list = document.getElementById('favList');
    list.textContent = '';
    const shown = favourites.filter(f => filter === 'all' || (filter === 'todo' ? !f.purchased_at : !!f.purchased_at));
    if (!shown.length) return list.appendChild(emptyMessage());
    shown.forEach(f => list.appendChild(favouriteRow(f)));
  }

  function showLoadError(message) {
    const list = document.getElementById('favList');
    list.textContent = '';
    const li = el('li', 'glass-panel rounded-2xl p-6 flex flex-col items-start gap-3 lg:col-span-2');
    li.appendChild(el('p', 'text-error', message));
    const retry = el('button', 'px-4 py-2 rounded-xl bg-primary text-on-primary font-label-lg fav-focusable', 'Try again');
    retry.type = 'button';
    retry.addEventListener('click', load);
    li.appendChild(retry);
    list.appendChild(li);
    document.getElementById('progressText').textContent = "Couldn't load favourites";
  }

  function load() {
    return loadWithCache('/api/favourites', {
      render: (data, meta) => {
        favourites = Array.isArray(data) ? data : [];
        document.getElementById('savedNote').textContent = meta.fromCache && meta.stale ? 'Saved copy from ' + ebTimeSince(meta.savedAt) : '';
        render();
      },
      onError: err => showLoadError(err.message),
    });
  }

  // Ticks update instantly and roll back if saving fails.
  async function setPurchased(f, purchased) {
    const before = f.purchased_at;
    f.purchased_at = purchased ? new Date().toISOString() : null;
    render();
    try {
      const { data } = await apiSend('PUT', '/api/favourites/' + f.id, { purchased });
      Object.assign(f, data);
      render();
      showToast(purchased ? 'Marked ' + f.item_name + ' as purchased' : f.item_name + ' is back on your to-buy list');
    } catch (err) {
      f.purchased_at = before;
      render();
      showToast("Couldn't update: " + err.message, { error: true });
    }
  }

  async function removeFavourite(f) {
    const index = favourites.indexOf(f);
    favourites.splice(index, 1);
    render();
    try {
      await apiSend('DELETE', '/api/favourites/' + f.id);
      showToast('Removed ' + f.item_name + ' from favourites');
    } catch (err) {
      favourites.splice(index, 0, f);
      render();
      showToast("Couldn't remove: " + err.message, { error: true });
    }
  }

  async function addToGroceryList(f) {
    try {
      const { data } = await apiSend('POST', '/api/grocery-list', {
        itemName: f.item_name, storeName: f.store_name, price: f.price, link: f.link, thumbnail: f.thumbnail, addedFrom: 'manual',
      });
      showToast(data.alreadyExisted ? f.item_name + ' is already on your grocery list' : 'Added ' + f.item_name + ' to your grocery list');
    } catch (err) {
      showToast("Couldn't add: " + err.message, { error: true });
    }
  }

  document.getElementById('addFavForm').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('addFavInput');
    const itemName = input.value.trim();
    if (!itemName) return input.focus();
    try {
      const { data } = await apiSend('POST', '/api/favourites', { itemName });
      input.value = '';
      showToast(data.alreadyExisted ? data.item_name + ' is already in your favourites' : 'Added ' + data.item_name + ' to favourites');
      favourites = favourites.filter(f => f.id !== data.id);
      favourites.unshift(data);
      if (!data.alreadyExisted && filter === 'done') filter = 'all';
      render();
    } catch (err) {
      showToast("Couldn't add: " + err.message, { error: true });
    }
  });

  document.querySelectorAll('.fav-filter').forEach(btn => btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    try { localStorage.setItem(FILTER_KEY, filter); } catch (e) { /* storage blocked */ }
    render();
  }));

  document.getElementById('clearPurchasedBtn').addEventListener('click', async () => {
    try {
      const { data } = await apiSend('POST', '/api/favourites/clear-purchased');
      favourites.forEach(f => { f.purchased_at = null; });
      render();
      showToast(data.cleared + (data.cleared === 1 ? ' item is' : ' items are') + ' back on your to-buy list');
    } catch (err) {
      showToast("Couldn't reset: " + err.message, { error: true });
    }
  });

  (async () => {
    const user = await requireAuthOrRedirect();
    if (!user) return;
    load();
  })();
</script>
</body></html>
