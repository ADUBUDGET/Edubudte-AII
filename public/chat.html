<script src="/shared.js"></script>
<script>
  (async () => {
    const user = await requireAuthOrRedirect();
    if (!user) return;

    const messagesEl = document.getElementById('messages');
    const chipsEl = document.getElementById('chips');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    let sending = false;

    const firstName = ((user.name || '').trim().split(/\s+/)[0]) || '';
    const GREETING = 'Hey' + (firstName ? ' ' + firstName : '') + "! I'm EduChatBot, your student money buddy. I can help you plan a budget, build a grocery list that fits your money, or find ways to save. What's up?";

    // All text is added with textContent (never innerHTML) so messages can never inject HTML.
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function scrollToEnd() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUser(text) {
      const row = el('div', 'flex justify-end');
      row.appendChild(el('div', 'bg-primary text-on-primary rounded-2xl rounded-br-md px-4 py-3 font-body-md max-w-[85%] whitespace-pre-wrap break-words glow-accent', text));
      messagesEl.appendChild(row);
      scrollToEnd();
    }

    function addBot(text) {
      const row = el('div', 'flex items-end gap-3 max-w-[92%]');
      const avatar = el('div', 'w-8 h-8 shrink-0 rounded-full bg-primary-container/10 flex items-center justify-center text-primary border border-primary/20');
      const icon = el('span', 'material-symbols-outlined', 'smart_toy');
      icon.style.fontSize = '18px';
      avatar.appendChild(icon);
      const bubble = el('div', 'glass-panel rounded-2xl rounded-bl-md px-4 py-3 font-body-md text-on-surface whitespace-pre-wrap break-words backdrop-blur-3xl', text);
      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToEnd();
      return bubble;
    }

    async function loadHistory() {
      try {
        const resp = await fetch('/api/chat/history');
        if (resp.status === 401) { window.location.href = '/login.html'; return; }
        const data = await resp.json();
        const msgs = data.messages || [];
        if (msgs.length === 0) {
          addBot(GREETING);
        } else {
          chipsEl.classList.add('hidden');
          msgs.forEach(m => (m.role === 'user' ? addUser(m.content) : addBot(m.content)));
        }
      } catch (e) {
        addBot(GREETING);
      }
    }

    async function send(rawText) {
      const text = (rawText || '').trim();
      if (!text || sending) return;
      sending = true;
      sendBtn.disabled = true;
      input.value = '';
      chipsEl.classList.add('hidden');
      addUser(text);
      const bubble = addBot('EduChatBot is thinking...');
      bubble.classList.add('animate-pulse');
      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        if (resp.status === 401) { window.location.href = '/login.html'; return; }
        const data = await resp.json().catch(() => ({}));
        bubble.textContent = resp.ok ? data.reply : (data.error || 'Something went wrong. Please try again.');
      } catch (e) {
        bubble.textContent = 'Could not reach the server. Please try again.';
      } finally {
        bubble.classList.remove('animate-pulse');
        sending = false;
        sendBtn.disabled = false;
        scrollToEnd();
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      send(input.value);
    });

    chipsEl.querySelectorAll('button[data-prompt]').forEach(btn => {
      btn.addEventListener('click', () => send(btn.getAttribute('data-prompt')));
    });

    document.getElementById('clearChatBtn').addEventListener('click', async () => {
      if (!confirm('Clear this whole conversation?')) return;
      try {
        await fetch('/api/chat/history', { method: 'DELETE' });
      } catch (e) { /* ignore */ }
      messagesEl.textContent = '';
      chipsEl.classList.remove('hidden');
      addBot(GREETING);
    });

    await loadHistory();
  })();
</script>
