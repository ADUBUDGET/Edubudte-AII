<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduChatBot - EduBudget AI</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6fb; color: #1b1f2a; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #1f3a8a; color: #fff; }
  header a, header button { color: #fff; background: none; border: 0; font-size: 14px; cursor: pointer; text-decoration: none; }
  header h1 { font-size: 18px; margin: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #1f3a8a; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #dde2ee; border-bottom-left-radius: 4px; }
  .typing { color: #6b7280; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #dde2ee; }
  input { flex: 1; padding: 12px 14px; border: 1px solid #c9d0e0; border-radius: 24px; font-size: 16px; }
  #send { padding: 0 20px; border: 0; border-radius: 24px; background: #1f3a8a; color: #fff; font-size: 16px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <a href="/dashboard.html">&larr; Back</a>
  <h1>EduChatBot</h1>
  <button id="clear" type="button">Clear</button>
</header>

<div id="messages"></div>

<form id="chat-form">
  <input id="chat-input" type="text" maxlength="1000" autocomplete="off"
         placeholder="Ask about budgets, groceries, saving...">
  <button id="send" type="submit">Send</button>
</form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");
const sendBtn = document.getElementById("send");
const clearBtn = document.getElementById("clear");

const GREETING = "Hey! I'm EduChatBot, your student money buddy. I can help you plan a budget, build a grocery list that fits your money, or find ways to save. What's up?";

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  div.textContent = text; // textContent (not innerHTML) so text can never inject HTML
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// Wrapper: if the session expired, send the user back to the login page.
async function api(url, options) {
  const res = await fetch(url, options);
  if (res.status === 401) {
    window.location.href = "/login.html";
    throw new Error("Not logged in");
  }
  return res;
}

async function loadHistory() {
  try {
    const res = await api("/api/chat/history");
    const data = await res.json();
    if (data.messages && data.messages.length) {
      data.messages.forEach(m => addMessage(m.role, m.content));
    } else {
      addMessage("assistant", GREETING);
    }
  } catch (e) {
    console.error(e);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMessage("user", text);
  const bubble = addMessage("assistant", "EduChatBot is typing...");
  bubble.classList.add("typing");
  sendBtn.disabled = true;
  try {
    const res = await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    bubble.classList.remove("typing");
    bubble.textContent = res.ok ? data.reply : (data.error || "Something went wrong. Please try again.");
  } catch (err) {
    bubble.classList.remove("typing");
    bubble.textContent = "Could not reach the server. Please try again.";
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

clearBtn.addEventListener("click", async () => {
  if (!confirm("Clear this whole conversation?")) return;
  await api("/api/chat/history", { method: "DELETE" });
  messagesEl.innerHTML = "";
  addMessage("assistant", GREETING);
});

loadHistory();
</script>
</body>
</html>
