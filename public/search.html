<script>
  let currentResults = [];
  let currentUser = null;

  let lastRadiusNote = null;
  let lastPricesCheckedAt = null;

  function renderResults(results, radiusNote = lastRadiusNote) {
    const container = document.getElementById('resultsContainer');
    const countLabel = document.getElementById('resultsCountLabel');
    countLabel.textContent = `Found ${results.length} item${results.length === 1 ? '' : 's'} matching your search`;
    if (lastPricesCheckedAt) {
      countLabel.textContent += ` · prices checked ${ebTimeSince(new Date(lastPricesCheckedAt).getTime())}`;
    }
    if (radiusNote) {
      countLabel.textContent += ` — ${radiusNote}`;
    }
    if (results.length === 0) {
      container.innerHTML = '<p class="text-on-surface-variant col-span-full">No products from our approved South African stores matched - try a simpler search term (e.g. "rice" instead of a brand and size).</p>';
      return;
    }
    const esc = ebEscape;
    const distanceLine = r => {
      if (r.proximity === 'nearby') return `<span class="text-primary">&middot; ${esc(formatDistanceLabel(r.distanceKm))}</span>`;
      if (r.proximity === 'far') return `<span class="text-yellow-300">&middot; Farther away: ${esc(formatDistanceLabel(r.distanceKm))}</span>`;
      if (r.proximity === 'unknown' && r.hasOwnProperty('distanceKm') && lastLocation && lastLocation.label) return '<span class="text-on-surface-variant/70 italic">&middot; distance unknown</span>';
      return '';
    };
    container.innerHTML = results.map((r, i) => `
      <article class="glass-panel rounded-2xl overflow-hidden group hover:-translate-y-1 transition-transform duration-300 flex flex-col">
        <div class="relative h-48 w-full overflow-hidden">
          <img alt="" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${esc(r.thumbnail || '')}" onerror="this.style.opacity=0">
          ${r.cheapestNearby ? '<span class="absolute top-3 left-3 bg-primary text-on-primary font-label-sm px-3 py-1 rounded-full">Cheapest nearby</span>' : ''}
        </div>
        <div class="p-4 flex flex-col gap-2 flex-grow">
          <div class="flex justify-between items-start">
            <h3 class="font-label-lg text-label-lg text-on-background line-clamp-2 text-on-background">${esc(r.title || 'Untitled')}</h3>
            <span class="font-headline-lg-mobile text-headline-lg-mobile font-bold ml-2 whitespace-nowrap text-primary">${esc(r.extracted_price != null ? formatZAR(r.extracted_price) : (r.price || 'N/A'))}</span>
          </div>
          ${/^https?:\/\//i.test(r.link || '') ? `<a href="${esc(r.link)}" target="_blank" rel="noopener" class="text-primary font-label-sm text-label-sm hover:underline">View listing</a>` : ''}
          <button class="mt-1 w-full py-2.5 rounded-xl bg-primary text-on-primary font-label-lg flex items-center justify-center gap-2 active:scale-95 transition-transform" onclick="addResultToBasket(${i})" type="button">
            <span class="material-symbols-outlined text-[18px]">add_shopping_cart</span><span>Add to basket</span>
          </button>
          <div class="mt-auto pt-4 border-t border-glass-stroke/50 flex flex-col gap-1">
            <div class="flex items-center gap-1 text-on-surface-variant font-label-sm text-label-sm text-on-background">
              <span class="material-symbols-outlined text-[14px]">storefront</span>
              <span>${esc(r.supplierName || r.source || 'Unknown store')}</span>
              ${distanceLine(r)}
            </div>
            ${r.branchName ? `<div class="text-on-surface-variant text-xs">Nearest: ${esc(r.branchName)}</div>` : ''}
            <button class="flex items-center gap-1 text-primary font-label-sm text-label-sm hover:underline text-left" onclick="getDirections(${i})" type="button">
              <span class="material-symbols-outlined text-[14px]">directions_car</span>
              <span>Directions &amp; Travel Cost</span>
            </button>
            <button class="flex items-center gap-1 text-on-surface-variant font-label-sm text-label-sm hover:text-primary text-left" onclick="saveFavourite(${i})" type="button">
              <span class="material-symbols-outlined text-[14px]">favorite</span>
              <span>Save to Favourites</span>
            </button>
          </div>
        </div>
      </article>
    `).join('');
  }

  // ---- Shopping area (saved on the account; see location.js) ----
  let lastLocation = null;   // what the server says is saved: { label, hasLocation, radiusKm, source }
  let savedRadius = null;

  function formatDistanceLabel(km) {
    if (km == null || !isFinite(Number(km))) return 'distance unknown';
    const n = Number(km);
    if (n < 1) return Math.max(50, Math.round(n * 1000 / 50) * 50) + ' m away';
    return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' km away';
  }

  function showArea(loc) {
    lastLocation = loc;
    const input = document.getElementById('locationInput');
    input.value = loc && loc.hasLocation ? loc.label : '';
    input.dataset.saved = input.value;
    if (loc && loc.radiusKm) {
      savedRadius = loc.radiusKm;
      document.getElementById('radiusManualInput').value = loc.radiusKm;
      document.getElementById('radiusInput').value = Math.min(100, loc.radiusKm);
    }
  }

  async function loadArea() {
    try {
      const resp = await fetch('/api/location');
      if (resp.ok) showArea(await resp.json());
    } catch (e) { /* offline: search still works without distances */ }
  }

  // Saves a typed area if it changed. Returns false if it couldn't be used.
  async function saveTypedArea() {
    const input = document.getElementById('locationInput');
    const text = input.value.trim();
    if (text === (input.dataset.saved || '')) return true;
    try {
      if (!text) {
        showArea((await apiSend('DELETE', '/api/location')).data);
        showToast('Shopping area cleared - shops are no longer sorted by distance');
        return true;
      }
      showArea((await apiSend('PUT', '/api/location', { source: 'typed', label: text })).data);
      showToast('Shopping area set to ' + text);
      return true;
    } catch (err) {
      showToast(err.message, { error: true });
      input.focus();
      return false;
    }
  }

  // Current location is only read after the student taps the button (the
  // browser then asks for permission).
  document.getElementById('useMyLocationBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return showToast("Your browser can't share your location - type your suburb or postcode instead.", { error: true });
    showToast('Finding your location...');
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        showArea((await apiSend('PUT', '/api/location', { source: 'gps', lat: pos.coords.latitude, lng: pos.coords.longitude })).data);
        showToast('Using your current location for nearby shops');
        if (document.getElementById('itemInput').value.trim()) doSearch();
      } catch (err) {
        showToast(err.message, { error: true });
      }
    }, err => {
      const denied = err && err.code === 1;
      showToast(denied ? 'Location permission was denied - type your suburb or postcode instead.' : "Couldn't get your location - type your suburb or postcode instead.", { error: true });
      document.getElementById('locationInput').focus();
    }, { timeout: 10000, maximumAge: 5 * 60 * 1000 });
  });

  // Radius changes are saved (after a short pause while dragging).
  let radiusTimer = null;
  function saveRadiusSoon() {
    clearTimeout(radiusTimer);
    radiusTimer = setTimeout(async () => {
      const km = Number(document.getElementById('radiusManualInput').value);
      if (!(km >= 1 && km <= 200) || km === savedRadius) return;
      try {
        savedRadius = (await apiSend('PUT', '/api/location', { radiusKm: km })).data.radiusKm;
        if (currentResults.length) showToast('Search radius set to ' + km + ' km - search again to update the list');
      } catch (err) { showToast(err.message, { error: true }); }
    }, 700);
  }

  async function addResultToBasket(i) {
    const r = currentResults[i];
    try {
      await addToBasket({
        itemName: r.title, productTitle: r.title, supplierId: r.supplierId, price: r.extracted_price ?? null,
        productId: r.product_id || null, priceCheckedAt: lastPricesCheckedAt,
        quantity: 1, link: r.link || null, thumbnail: r.thumbnail || null, addedFrom: 'shop',
      });
    } catch (err) {
      showToast("Couldn't add to basket: " + err.message, { error: true });
    }
  }

  async function doSearch() {
    const item = document.getElementById('itemInput').value.trim();
    const minPrice = document.getElementById('minInput').value;
    const maxPrice = document.getElementById('maxInput').value;
    if (!item) {
      showToast('Type what you are looking for first', { error: true });
      return document.getElementById('itemInput').focus();
    }

    if (!(await saveTypedArea())) return;
    const location = '';
    const btnLabel = document.getElementById('searchBtnLabel');
    btnLabel.textContent = 'Searching...';
    document.getElementById('recommendationBanner').classList.add('hidden');
    document.getElementById('resultsContainer').innerHTML = '<p class="text-on-surface-variant col-span-full">Searching real listings...</p>';

    try {
      const resp = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          item,
          minPrice: minPrice || null,
          maxPrice: maxPrice || null,
        }),
      });
      const data = await resp.json();
      btnLabel.textContent = 'Search Local';

      if (data.error) {
        document.getElementById('resultsContainer').innerHTML = `<p class="text-error col-span-full">${ebEscape(data.error)}. Please try again.</p>`;
        return;
      }
      if (data.location) lastLocation = { ...(lastLocation || {}), label: data.location.label, radiusKm: data.location.radiusKm };

      if (data.recommendation) {
        document.getElementById('recommendationText').textContent = data.recommendation;
        document.getElementById('recommendationBanner').classList.remove('hidden');
      }
      if (data.radiusNote) {
        document.getElementById('resultsCountLabel').dataset.radiusNote = data.radiusNote;
      }

      currentResults = data.results || [];
      lastRadiusNote = data.radiusNote || null;
      lastPricesCheckedAt = data.pricesCheckedAt || new Date().toISOString();
      renderResults(currentResults, data.radiusNote);

      // Remember this search so coming back to Shop shows it again, and
      // refresh "Most frequently searched" (and other caches a search affects).
      ebCache.invalidateFor('/api/search');
      ebCache.set(LAST_SEARCH_KEY, {
        form: { item, minPrice, maxPrice },
        results: currentResults,
        recommendation: data.recommendation || null,
        radiusNote: lastRadiusNote,
        pricesCheckedAt: lastPricesCheckedAt,
      });
      loadFrequentSearches();
    } catch (err) {
      btnLabel.textContent = 'Search Local';
      document.getElementById('resultsContainer').innerHTML = '<p class="text-error col-span-full">Network error - is the server running?</p>';
    }
  }

  function sortResults(dir) {
    currentResults = [...currentResults].sort((a, b) => {
      const pa = a.extracted_price ?? Infinity, pb = b.extracted_price ?? Infinity;
      return dir === 'asc' ? pa - pb : pb - pa;
    });
    renderResults(currentResults);
  }
  document.getElementById('sortLowHigh').addEventListener('click', () => sortResults('asc'));
  document.getElementById('sortHighLow').addEventListener('click', () => sortResults('desc'));
  document.getElementById('sortClosest').addEventListener('click', () => {
    if (!lastLocation || !lastLocation.label) {
      showToast('Set your shopping area first to sort by distance', { error: true });
      return document.getElementById('locationInput').focus();
    }
    currentResults = [...currentResults].sort((a, b) => (a.distanceKm ?? Infinity) - (b.distanceKm ?? Infinity));
    renderResults(currentResults);
  });

  async function saveFavourite(i) {
    const r = currentResults[i];
    try {
      const { data } = await apiSend('POST', '/api/favourites', {
        itemName: r.title, storeName: r.source, supplierId: r.supplierId || null, price: r.extracted_price ?? null, link: r.link || null, thumbnail: r.thumbnail || null,
        productId: r.product_id || null, priceCheckedAt: lastPricesCheckedAt,
      });
      showToast(data.alreadyExisted ? 'Already in your favourites - saved price updated' : 'Added to favourites');
    } catch (err) {
      showToast("Couldn't save: " + err.message, { error: true });
    }
  }

  // ---- Last search + most frequently searched ----
  const LAST_SEARCH_KEY = '/page/search/last';

  function runSearchFor(query) {
    document.getElementById('itemInput').value = query;
    doSearch();
  }

  function loadFrequentSearches() {
    renderFrequentSearches(document.getElementById('frequentSearches'), { onPick: runSearchFor });
  }

  // Coming back to Shop shows the last search instead of an empty page.
  // Prices older than the price max age are labelled, not shown as current.
  function restoreLastSearch() {
    const saved = ebCache.get(LAST_SEARCH_KEY);
    if (!saved || !saved.data || !Array.isArray(saved.data.results)) return false;
    const last = saved.data;
    document.getElementById('itemInput').value = last.form.item || '';
    document.getElementById('minInput').value = last.form.minPrice || '';
    if (last.form.maxPrice) document.getElementById('maxInput').value = last.form.maxPrice;
    currentResults = last.results;
    lastRadiusNote = last.radiusNote;
    lastPricesCheckedAt = last.pricesCheckedAt;
    if (last.recommendation) {
      document.getElementById('recommendationText').textContent = last.recommendation;
      document.getElementById('recommendationBanner').classList.remove('hidden');
    }
    renderResults(currentResults);
    const age = Date.now() - new Date(last.pricesCheckedAt).getTime();
    if (age > EB_MAX_AGE.prices) {
      // Older prices are never shown as current: refresh straight away when
      // online (the server reuses its own recent real results, so this is
      // usually free), otherwise say clearly how old they are.
      const countLabel = document.getElementById('resultsCountLabel');
      countLabel.textContent = 'Your last search - prices from ' + ebTimeSince(new Date(last.pricesCheckedAt).getTime()) + (navigator.onLine === false ? ' (you’re offline, so they may have changed).' : ', updating...');
      if (navigator.onLine !== false && last.form.item) doSearch();
    }
    return true;
  }

  // Resolves a store name to one exact nearby branch using the browser's
  // real GPS position, then fetches real distance/time + estimated
  // travel costs and shows them, plus mode-specific Maps links.
  function openTravelModal() {
    document.getElementById('travelModal').classList.remove('hidden');
    document.getElementById('travelModal').classList.add('flex');
  }
  function closeTravelModal() {
    document.getElementById('travelModal').classList.add('hidden');
    document.getElementById('travelModal').classList.remove('flex');
  }
  document.getElementById('closeTravelModal').addEventListener('click', closeTravelModal);
  document.getElementById('travelModal').addEventListener('click', (e) => {
    if (e.target.id === 'travelModal') closeTravelModal();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTravelModal(); });

  function getDirections(i) {
    const r = currentResults[i];
    const storeName = r.source || '';
    const location = document.getElementById('locationInput').value.trim();
    const modalContent = document.getElementById('travelModalContent');
    const openFallback = () => {
      const q = encodeURIComponent(`${storeName} ${location}`.trim());
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${q}`, '_blank');
    };

    if (!navigator.geolocation) {
      showToast("Your browser doesn't support location - opening an approximate search instead.");
      return openFallback();
    }

    modalContent.innerHTML = '<p class="text-on-surface-variant font-label-sm">Finding nearest branch and travel options...</p>';
    openTravelModal();

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude: originLat, longitude: originLng } = pos.coords;
        try {
          // If the search step already resolved this exact branch's real
          // coordinates (radius filtering), reuse them so this popup shows
          // the SAME branch instead of a fresh, potentially different match.
          let storeUrl = `/api/nearest-store?name=${encodeURIComponent(storeName)}&lat=${originLat}&lng=${originLng}&locationText=${encodeURIComponent(location)}`;
          if (r.storeLat != null && r.storeLng != null) {
            storeUrl += `&knownLat=${r.storeLat}&knownLng=${r.storeLng}`;
          }
          const storeResp = await fetch(storeUrl);
          const store = await storeResp.json();
          if (!store.found || !store.lat || !store.lng) {
            modalContent.innerHTML = '<p class="text-on-surface-variant font-label-sm">Exact branch not found - opened an approximate search instead.</p>';
            return openFallback();
          }

          const budget = document.getElementById('maxInput').value || null;
          const travelResp = await fetch('/api/travel-options', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              originLat, originLng, destLat: store.lat, destLng: store.lng,
              itemPrice: r.extracted_price || null, budget,
            }),
          });
          const travel = await travelResp.json();

          if (travel.error) {
            modalContent.innerHTML = `<p class="text-error font-label-sm">Travel estimate failed: ${travel.detail || travel.error}</p>`;
            return;
          }

          const driveUrl = `https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}&travelmode=driving`;
          const walkUrl = `https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}&travelmode=walking`;

          modalContent.innerHTML = `
            <h3 class="font-label-lg text-label-lg text-on-background mb-2 pr-4">${store.title || storeName}</h3>
            <div class="text-on-surface-variant font-body-md text-sm mb-3">${store.address || 'Address unavailable'}</div>
            ${store.exactMatch ? `<div class="text-xs text-primary mb-3">✓ Same branch used in your search results</div>` : ''}
            ${store.usedTypedLocation ? `<div class="text-xs text-on-surface-variant/70 mb-3">Searched near "${location}", not your current GPS position.</div>` : ''}
            <div class="space-y-2 font-label-sm text-label-sm text-on-surface-variant border-t border-glass-stroke pt-3">
              <div class="text-on-background font-semibold">Distance: ${travel.distanceKm} km</div>
              <div>🚶 Walking: ${travel.walking.durationMin} min - R0 - <a class="text-primary hover:underline" href="${walkUrl}" target="_blank">open in Maps</a></div>
              <div>🚕 Taxi (est.): ${formatZAR(travel.taxiEstimate)} - <a class="text-primary hover:underline" href="${driveUrl}" target="_blank">open in Maps</a></div>
              <div>🚗 Uber (est.): ${travel.uberEstimate != null ? formatZAR(travel.uberEstimate) : 'N/A'} - <a class="text-primary hover:underline" href="${driveUrl}" target="_blank">open in Maps</a></div>
              ${travel.remainingBudget != null ? `<div>Remaining budget after item: ${formatZAR(travel.remainingBudget)}</div>` : ''}
            </div>
            <div class="text-primary italic text-sm pt-3 mt-3 border-t border-glass-stroke">AI: ${travel.recommendation}</div>
          `;
        } catch (e) {
          modalContent.innerHTML = '<p class="text-on-surface-variant font-label-sm">Something went wrong - opened an approximate search instead.</p>';
          openFallback();
        }
      },
      () => {
        showToast('Location permission denied - opening an approximate search instead.');
        openFallback();
      }
    );
  }

  // Distance: slider and manual number input stay in sync both ways.
  // Slider visually caps at 100 km (keeps the drag range usable); the manual
  // input allows up to 200 km. The value is saved as the search radius.
  const radiusSlider = document.getElementById('radiusInput');
  const radiusManual = document.getElementById('radiusManualInput');
  radiusSlider.addEventListener('input', () => { radiusManual.value = radiusSlider.value; saveRadiusSoon(); });
  radiusManual.addEventListener('input', () => {
    const v = Number(radiusManual.value);
    if (v >= 1 && v <= Number(radiusSlider.max)) radiusSlider.value = v;
    saveRadiusSoon();
  });
  document.getElementById('locationInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveTypedArea(); });

  // Voice search: click the mic, speak, it fills the box and searches
  // automatically. Uses the browser's built-in Web Speech API (free, no
  // key) - supported in Chrome/Edge; Safari/Firefox support varies.
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  const micIcon = document.getElementById('micIcon');
  if (SpeechRecognitionAPI) {
    const recognition = new SpeechRecognitionAPI();
    recognition.lang = 'en-ZA';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let listening = false;
    micBtn.addEventListener('click', () => {
      if (listening) { recognition.stop(); return; }
      try {
        recognition.start();
      } catch (e) { /* already started - ignore */ }
    });
    recognition.addEventListener('start', () => {
      listening = true;
      micIcon.textContent = 'graphic_eq';
      micBtn.classList.add('text-red-400');
    });
    recognition.addEventListener('end', () => {
      listening = false;
      micIcon.textContent = 'mic';
      micBtn.classList.remove('text-red-400');
    });
    recognition.addEventListener('result', (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById('itemInput').value = transcript;
      doSearch();
    });
    recognition.addEventListener('error', (event) => {
      if (event.error !== 'no-speech' && event.error !== 'aborted') {
        showToast('Voice search error: ' + event.error);
      }
    });
  } else {
    micBtn.addEventListener('click', () => {
      showToast("Voice search isn't supported in this browser - try Chrome or Edge.");
    });
  }

  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('itemInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  (async () => {
    currentUser = await requireAuthOrRedirect();
    if (!currentUser) return;

    const maxInput = document.getElementById('maxInput');
    if (!maxInput.value && currentUser.spendingTarget != null) {
      maxInput.value = currentUser.spendingTarget;
    }

    renderBudgetBar(document.getElementById('budgetStatusBanner'));
    await loadArea();

    loadFrequentSearches();
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
      runSearchFor(q);
    } else {
      restoreLastSearch();
    }
  })();
</script>
</body></html>
