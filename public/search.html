<script>
  let currentResults = [];
  let currentUser = null;

  function renderResults(results, radiusNote) {
    const container = document.getElementById('resultsContainer');
    const countLabel = document.getElementById('resultsCountLabel');
    countLabel.textContent = `Found ${results.length} item${results.length === 1 ? '' : 's'} matching your search`;
    if (radiusNote) {
      countLabel.textContent += ` — ${radiusNote}`;
    }
    if (results.length === 0) {
      container.innerHTML = '<p class="text-on-surface-variant col-span-full">No live results found - try a different search term.</p>';
      return;
    }
    container.innerHTML = results.map((r, i) => `
      <article class="glass-panel rounded-2xl overflow-hidden group hover:-translate-y-1 transition-transform duration-300 flex flex-col">
        <div class="relative h-48 w-full overflow-hidden">
          <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${r.thumbnail || ''}" onerror="this.style.opacity=0">
        </div>
        <div class="p-4 flex flex-col gap-2 flex-grow">
          <div class="flex justify-between items-start">
            <h3 class="font-label-lg text-label-lg text-on-background line-clamp-2 text-on-background">${r.title || 'Untitled'}</h3>
            <span class="font-headline-lg-mobile text-headline-lg-mobile font-bold ml-2 whitespace-nowrap text-primary">${r.price || 'N/A'}</span>
          </div>
          ${r.link ? `<a href="${r.link}" target="_blank" class="text-primary font-label-sm text-label-sm hover:underline">View listing</a>` : ''}
          <div class="mt-auto pt-4 border-t border-glass-stroke/50 flex flex-col gap-1">
            <div class="flex items-center gap-1 text-on-surface-variant font-label-sm text-label-sm text-on-background">
              <span class="material-symbols-outlined text-[14px]">storefront</span>
              <span>${r.source || 'Unknown store'}</span>
              ${r.distanceKm != null ? `<span class="text-primary ml-1">&middot; ${r.distanceKm} km away</span>` : (r.distanceKm === null && r.hasOwnProperty('distanceKm') ? `<span class="text-on-surface-variant/60 ml-1 italic">&middot; distance unverified</span>` : '')}
            </div>
            <button class="flex items-center gap-1 text-primary font-label-sm text-label-sm hover:underline text-left" onclick="getDirections(${i})" type="button">
              <span class="material-symbols-outlined text-[14px]">directions_car</span>
              <span>Directions &amp; Travel Cost</span>
            </button>
            <button class="flex items-center gap-1 text-on-surface-variant font-label-sm text-label-sm hover:text-primary text-left" onclick="saveFavourite(${i})" type="button">
              <span class="material-symbols-outlined text-[14px]">favorite</span>
              <span>Save to Favourites</span>
            </button>
          </div>
        </div>
      </article>
    `).join('');
  }

  // Best-effort geolocation with a short timeout - used as a radius-filter
  // anchor when no location text is typed. Never blocks the search if denied.
  function getPositionQuick(timeoutMs = 4000) {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        (pos) => { clearTimeout(timer); resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        () => { clearTimeout(timer); resolve(null); }
      );
    });
  }

  async function doSearch() {
    const item = document.getElementById('itemInput').value.trim();
    const location = document.getElementById('locationInput').value.trim();
    const minPrice = document.getElementById('minInput').value;
    const maxPrice = document.getElementById('maxInput').value;
    const radiusKm = document.getElementById('radiusManualInput').value;
    if (!item) return alert('Enter an item to search for');

    const btnLabel = document.getElementById('searchBtnLabel');
    btnLabel.textContent = 'Searching...';
    document.getElementById('recommendationBanner').classList.add('hidden');
    document.getElementById('resultsContainer').innerHTML = '<p class="text-on-surface-variant col-span-full">Searching real listings...</p>';

    // Only bother asking for GPS if a radius is set and no location text was
    // typed (location text takes priority as the anchor when both are given).
    let originLat = null, originLng = null;
    if (radiusKm && !location) {
      const pos = await getPositionQuick();
      if (pos) { originLat = pos.lat; originLng = pos.lng; }
    }

    try {
      const resp = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          item,
          minPrice: minPrice || null,
          maxPrice: maxPrice || null,
          location: location || null,
          radiusKm: radiusKm || null,
          originLat, originLng,
        }),
      });
      const data = await resp.json();
      btnLabel.textContent = 'Search Local';

      if (data.error) {
        document.getElementById('resultsContainer').innerHTML = `<p class="text-error col-span-full">Error: ${data.detail || data.error}</p>`;
        return;
      }

      if (data.recommendation) {
        document.getElementById('recommendationText').textContent = data.recommendation;
        document.getElementById('recommendationBanner').classList.remove('hidden');
      }
      if (data.radiusNote) {
        document.getElementById('resultsCountLabel').dataset.radiusNote = data.radiusNote;
      }

      currentResults = data.results || [];
      renderResults(currentResults, data.radiusNote);
    } catch (err) {
      btnLabel.textContent = 'Search Local';
      document.getElementById('resultsContainer').innerHTML = '<p class="text-error col-span-full">Network error - is the server running?</p>';
    }
  }

  function sortResults(dir) {
    currentResults = [...currentResults].sort((a, b) => {
      const pa = a.extracted_price ?? Infinity, pb = b.extracted_price ?? Infinity;
      return dir === 'asc' ? pa - pb : pb - pa;
    });
    renderResults(currentResults);
  }
  document.getElementById('sortLowHigh').addEventListener('click', () => sortResults('asc'));
  document.getElementById('sortHighLow').addEventListener('click', () => sortResults('desc'));

  async function saveFavourite(i) {
    const r = currentResults[i];
    await fetch('/api/favourites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ itemName: r.title, storeName: r.source, price: r.extracted_price || null, link: r.link || null }),
    });
    alert('Saved to favourites.');
  }

  // Resolves a store name to one exact nearby branch using the browser's
  // real GPS position, then fetches real distance/time + estimated
  // travel costs and shows them, plus mode-specific Maps links.
  function openTravelModal() {
    document.getElementById('travelModal').classList.remove('hidden');
    document.getElementById('travelModal').classList.add('flex');
  }
  function closeTravelModal() {
    document.getElementById('travelModal').classList.add('hidden');
    document.getElementById('travelModal').classList.remove('flex');
  }
  document.getElementById('closeTravelModal').addEventListener('click', closeTravelModal);
  document.getElementById('travelModal').addEventListener('click', (e) => {
    if (e.target.id === 'travelModal') closeTravelModal();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTravelModal(); });

  function getDirections(i) {
    const r = currentResults[i];
    const storeName = r.source || '';
    const location = document.getElementById('locationInput').value.trim();
    const modalContent = document.getElementById('travelModalContent');
    const openFallback = () => {
      const q = encodeURIComponent(`${storeName} ${location}`.trim());
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${q}`, '_blank');
    };

    if (!navigator.geolocation) {
      alert("Your browser doesn't support location - opening an approximate search instead.");
      return openFallback();
    }

    modalContent.innerHTML = '<p class="text-on-surface-variant font-label-sm">Finding nearest branch and travel options...</p>';
    openTravelModal();

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude: originLat, longitude: originLng } = pos.coords;
        try {
          // If the search step already resolved this exact branch's real
          // coordinates (radius filtering), reuse them so this popup shows
          // the SAME branch instead of a fresh, potentially different match.
          let storeUrl = `/api/nearest-store?name=${encodeURIComponent(storeName)}&lat=${originLat}&lng=${originLng}&locationText=${encodeURIComponent(location)}`;
          if (r.storeLat != null && r.storeLng != null) {
            storeUrl += `&knownLat=${r.storeLat}&knownLng=${r.storeLng}`;
          }
          const storeResp = await fetch(storeUrl);
          const store = await storeResp.json();
          if (!store.found || !store.lat || !store.lng) {
            modalContent.innerHTML = '<p class="text-on-surface-variant font-label-sm">Exact branch not found - opened an approximate search instead.</p>';
            return openFallback();
          }

          const budget = document.getElementById('maxInput').value || null;
          const travelResp = await fetch('/api/travel-options', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              originLat, originLng, destLat: store.lat, destLng: store.lng,
              itemPrice: r.extracted_price || null, budget,
            }),
          });
          const travel = await travelResp.json();

          if (travel.error) {
            modalContent.innerHTML = `<p class="text-error font-label-sm">Travel estimate failed: ${travel.detail || travel.error}</p>`;
            return;
          }

          const driveUrl = `https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}&travelmode=driving`;
          const walkUrl = `https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}&travelmode=walking`;

          modalContent.innerHTML = `
            <h3 class="font-label-lg text-label-lg text-on-background mb-2 pr-4">${store.title || storeName}</h3>
            <div class="text-on-surface-variant font-body-md text-sm mb-3">${store.address || 'Address unavailable'}</div>
            ${store.exactMatch ? `<div class="text-xs text-primary mb-3">✓ Same branch used in your search results</div>` : ''}
            ${store.usedTypedLocation ? `<div class="text-xs text-on-surface-variant/70 mb-3">Searched near "${location}", not your current GPS position.</div>` : ''}
            <div class="space-y-2 font-label-sm text-label-sm text-on-surface-variant border-t border-glass-stroke pt-3">
              <div class="text-on-background font-semibold">Distance: ${travel.distanceKm} km</div>
              <div>🚶 Walking: ${travel.walking.durationMin} min - R0 - <a class="text-primary hover:underline" href="${walkUrl}" target="_blank">open in Maps</a></div>
              <div>🚕 Taxi (est.): ${formatZAR(travel.taxiEstimate)} - <a class="text-primary hover:underline" href="${driveUrl}" target="_blank">open in Maps</a></div>
              <div>🚗 Uber (est.): ${travel.uberEstimate != null ? formatZAR(travel.uberEstimate) : 'N/A'} - <a class="text-primary hover:underline" href="${driveUrl}" target="_blank">open in Maps</a></div>
              ${travel.remainingBudget != null ? `<div>Remaining budget after item: ${formatZAR(travel.remainingBudget)}</div>` : ''}
            </div>
            <div class="text-primary italic text-sm pt-3 mt-3 border-t border-glass-stroke">AI: ${travel.recommendation}</div>
          `;
        } catch (e) {
          modalContent.innerHTML = '<p class="text-on-surface-variant font-label-sm">Something went wrong - opened an approximate search instead.</p>';
          openFallback();
        }
      },
      () => {
        alert('Location permission denied - opening an approximate search instead.');
        openFallback();
      }
    );
  }

  async function refreshBudgetStatus() {
    try {
      const resp = await fetch('/api/dashboard');
      const dash = await resp.json();
      const target = currentUser.spendingTarget != null ? Number(currentUser.spendingTarget) : Number(dash.monthlyBudget);
      const spent = Number(dash.totalSpent);
      const remaining = target - spent;
      const banner = document.getElementById('budgetStatusBanner');
      const icon = document.getElementById('budgetStatusIcon');
      const text = document.getElementById('budgetStatusText');

      banner.classList.remove('bg-red-500/10', 'border', 'border-red-500/40', 'bg-yellow-500/10', 'border-yellow-500/40');
      if (remaining < 0) {
        icon.textContent = 'warning';
        icon.className = 'material-symbols-outlined text-red-400';
        text.className = 'font-body-md text-body-md flex-1 text-red-400';
        text.textContent = `Over budget: you've spent ${formatZAR(spent)} of your ${formatZAR(target)} target (${formatZAR(Math.abs(remaining))} over).`;
      } else if (remaining < target * 0.2) {
        icon.textContent = 'error_outline';
        icon.className = 'material-symbols-outlined text-yellow-400';
        text.className = 'font-body-md text-body-md flex-1 text-yellow-400';
        text.textContent = `Getting close: ${formatZAR(remaining)} left of your ${formatZAR(target)} target.`;
      } else {
        icon.textContent = 'account_balance_wallet';
        icon.className = 'material-symbols-outlined text-primary';
        text.className = 'font-body-md text-body-md flex-1 text-on-surface-variant';
        text.textContent = `${formatZAR(remaining)} left of your ${formatZAR(target)} target (${formatZAR(spent)} spent so far).`;
      }
      return { target, spent, remaining };
    } catch (e) {
      document.getElementById('budgetStatusText').textContent = 'Set a Spending Target or Monthly Budget on the Profile page to see this.';
      return null;
    }
  }

  // Distance: slider and manual number input stay in sync both ways.
  // Slider visually caps at 100km (keeps the drag range usable), but the
  // manual input allows any value (e.g. 500+ km for cross-province searches)
  // - the manual input is always the source of truth sent to the backend.
  const radiusSlider = document.getElementById('radiusInput');
  const radiusManual = document.getElementById('radiusManualInput');
  radiusSlider.addEventListener('input', () => { radiusManual.value = radiusSlider.value; });
  radiusManual.addEventListener('input', () => {
    const v = Number(radiusManual.value);
    if (v >= 1 && v <= Number(radiusSlider.max)) radiusSlider.value = v;
  });

  // Voice search: click the mic, speak, it fills the box and searches
  // automatically. Uses the browser's built-in Web Speech API (free, no
  // key) - supported in Chrome/Edge; Safari/Firefox support varies.
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  const micIcon = document.getElementById('micIcon');
  if (SpeechRecognitionAPI) {
    const recognition = new SpeechRecognitionAPI();
    recognition.lang = 'en-ZA';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let listening = false;
    micBtn.addEventListener('click', () => {
      if (listening) { recognition.stop(); return; }
      try {
        recognition.start();
      } catch (e) { /* already started - ignore */ }
    });
    recognition.addEventListener('start', () => {
      listening = true;
      micIcon.textContent = 'graphic_eq';
      micBtn.classList.add('text-red-400');
    });
    recognition.addEventListener('end', () => {
      listening = false;
      micIcon.textContent = 'mic';
      micBtn.classList.remove('text-red-400');
    });
    recognition.addEventListener('result', (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById('itemInput').value = transcript;
      doSearch();
    });
    recognition.addEventListener('error', (event) => {
      if (event.error !== 'no-speech' && event.error !== 'aborted') {
        alert('Voice search error: ' + event.error);
      }
    });
  } else {
    micBtn.addEventListener('click', () => {
      alert("Voice search isn't supported in this browser - try Chrome or Edge.");
    });
  }

  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('itemInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  (async () => {
    currentUser = await requireAuthOrRedirect();
    if (!currentUser) return;

    const maxInput = document.getElementById('maxInput');
    if (!maxInput.value && currentUser.spendingTarget != null) {
      maxInput.value = currentUser.spendingTarget;
    }

    await refreshBudgetStatus();

    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
      document.getElementById('itemInput').value = q;
      doSearch();
    }
  })();
</script>
</body></html>
