# Netlify: pages from public/ on the CDN, the Express API as a function.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm ci --omit=dev"

[build.environment]
  # @netlify/functions needs Node 22.12+.
  NODE_VERSION = "22"
  # GROQ_MODEL is a public model name (it is in server.js and the README),
  # not a secret - don't fail the build when the secrets scan finds it.
  SECRETS_SCAN_OMIT_KEYS = "GROQ_MODEL"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/unsubscribe"
  to = "/.netlify/functions/api/unsubscribe"
  status = 200
  force = true
