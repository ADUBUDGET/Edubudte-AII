# Netlify: pages from public/ on the CDN, the Express API as a function.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm ci --omit=dev"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/unsubscribe"
  to = "/.netlify/functions/api/unsubscribe"
  status = 200
  force = true
